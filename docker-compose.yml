# ComplianceOS AI — local development & deployment stack
#
# Services:
#   web  - Next.js frontend (apps/web)
#   api  - Node API service (apps/api)
#   db   - PostgreSQL
#
# Usage:
#   docker compose up -d        # start all
#   docker compose down         # stop
#   docker compose logs -f web  # tail logs

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-complianceos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-complianceos}
      POSTGRES_DB: ${POSTGRES_DB:-complianceos}
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-complianceos}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-complianceos}:${POSTGRES_PASSWORD:-complianceos}@db:5432/${POSTGRES_DB:-complianceos}
      AUTH_SECRET: ${AUTH_SECRET:-change-me}
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_BASE_URL: http://api:4000
    ports:
      - '3000:3000'

volumes:
  db_data:
